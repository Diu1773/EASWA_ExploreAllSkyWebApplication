services:
  - type: web
    name: easwa-webapp
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # Public origin of this service. Two jobs, and both broke while it was unset:
      #  1. OAuth builds its callback as {BASE_URL}/api/auth/callback — without
      #     this it pointed at localhost, so Google sign-in could never complete.
      #  2. config.py reads a localhost BASE_URL as "this is a dev box" and hands
      #     out dev defaults. On Render that silently meant a 96 MB cutout cache
      #     (vs 16 MB) plus 2 preview / 4 frame-count workers (vs 1 each) on a
      #     512 MB instance — the OOM guard was effectively off.
      - key: EASWA_BASE_URL
        value: https://easwa-webapp.onrender.com
      - key: EASWA_DEBUG
        value: "false"
      # Max cutout size. RAM is no longer the limit (lazy memmap + chunked reads),
      # so allow the full range; the download guard below blocks the rare combo
      # (e.g. 99px on a 200s-cadence sector) that would overflow the staging disk.
      - key: EASWA_TRANSIT_MAX_CUTOUT_SIZE_PX
        value: "99"
      # Persistent cross-request FITS cache: off (Render free disk is ephemeral).
      - key: EASWA_TRANSIT_CUTOUT_DISK_CACHE_ENABLED
        value: "false"
      # Stream the ZIP/FITS through a temp file during loading (not RAM). This is
      # the load-step OOM guard — independent of the persistent cache above.
      - key: EASWA_TRANSIT_CUTOUT_STAGE_TO_DISK
        value: "true"
      # Keep staging temp files on the ephemeral /tmp mount, deleted per request.
      - key: EASWA_TRANSIT_CUTOUT_STAGE_DIR
        value: "/tmp/easwa-transit-staging"
      # Cap the TESSCut ZIP download (~600 MB) so the ZIP+FITS staging footprint
      # stays within the ephemeral disk. Allows 99px for normal cadences; the
      # 99px/200s monster fails fast with a clear "too large" message.
      - key: EASWA_TRANSIT_CUTOUT_MAX_DOWNLOAD_BYTES
        value: "629145600"
      - key: EASWA_SESSION_SECRET
        generateValue: true
      - key: EASWA_RECORD_REQUIRE_LOGIN
        value: "false"
      # Google sign-in. sync:false keeps the secret out of this public repo — set
      # both in the Render dashboard. Unset → the login button 500s. The matching
      # redirect URI ({EASWA_BASE_URL}/api/auth/callback) must also be registered
      # in the Google Cloud console, or Google rejects the request itself.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Anonymous-submit sink (Apps Script Web App /exec URL). sync:false keeps the
      # value out of this public repo — set it in the Render dashboard. Render passes
      # it to the Docker build, where the Dockerfile ARG feeds it into the Vite build.
      # Unset → the Step 6 submit button shows "제출 서버 미설정" (disabled, not hidden).
      # Changing it requires a REBUILD, not just a restart: Vite bakes it into the bundle.
      - key: VITE_RECORD_SINK_URL
        sync: false
      - key: VITE_APP_VERSION
        value: "render"
      # --- 동시 사용 실측 기반 (docs/LOAD_TEST_2026-07.md 9.6) ---
      # 큐 대기 상한. 기본 90초면 적합이 동시 3개씩만 돌아 10명에서 1명,
      # 20명에서 11명이 "차례가 오지 않았습니다"로 실패한다. 300초로 두면
      # 20명 전원 성공(마지막 사람 약 4.4분 대기).
      - key: EASWA_STREAM_QUEUE_WAIT_SECONDS
        value: "300"
      # 측광 IP별 분당 상한. 연수장은 NAT라 전원이 공인 IP 하나를 공유하므로
      # 기본 6회/분이면 7번째 학습자부터 429를 맞는다. 전역 동시상한(8)이
      # 실제 부하를 막고 있으므로 이 값 완화는 안전하다.
      - key: EASWA_TRANSIT_PHOTOMETRY_LIMIT
        value: "40"
