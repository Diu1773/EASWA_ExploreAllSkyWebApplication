<p class="note">마크는 단색이라 바탕에 따라 흰색·먹색으로 바뀝니다. 위가 검정, 아래가 흰 바탕입니다.</p>

  <div class="pane dk"><div class="lock"><svg class="mk" width="54" height="54" viewBox="0 0 640 640" aria-hidden="true"><use href="#m"/></svg><span>ASWA</span></div></div>

</div>
